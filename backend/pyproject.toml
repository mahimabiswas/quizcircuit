[project]
name = "quizcircuit-backend"
version = "0.1.0"
description = "QuizCircuit game server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-genai>=3.6.1",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",  # required by FastAPI's TestClient
    "pytest>=8.3",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
